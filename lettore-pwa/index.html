        // l'ultimo errore ricevuto da Google per questo modello, utile per capire cosa non va
        const er = (store.get('gemErr') || {})[m];
        if(er && now - er.at < 3 * 864e5) how.appendChild(el('div', 'modelErr', `Ultima risposta di Google (${new Date(er.at).toLocaleString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}): ${er.s} - ${er.t}`));
      });
      ca.appendChild(how);
      // consumo di oggi e stima di quanto si può ancora ascoltare
      const fc = gemForecast();
      const fmtM = m => m >= 1 ? (Math.round(m * 10) / 10).toString().replace('.', ',') : '<1';
      ca.appendChild(famRow('Oggi', `${fc.used} richieste usate, ${fmtMin(fc.genMin)} di audio ricevuti.${fc.cut ? ` Google ha tagliato ${fc.cut} ${fc.cut === 1 ? 'parte' : 'parti'}, ora le faccio più corte.` : ''}`, null));
      ca.appendChild(famRow('Ancora disponibili', `Circa ${fc.left} richieste, cioè circa ${fmtMin(fc.leftMin)} di ascolto. Ogni richiesta vale ${fc.measured ? 'in media' : 'circa'} ${fmtM(fc.avgMin)} minuti${fc.measured ? '' : ' (stima, diventa precisa dopo le prime parti)'}.`, null));
      // monitoraggio: per modello, ultime richieste, ultimi giorni
      ca.appendChild(el('div', 'innerLabel', 'Richieste di oggi per modello'));
      const stNow = gemStats(), blNow = store.get('gemBlocked') || {}, tNow = Date.now();
      // cosa ha risposto Google: tipo di limite (richieste o token, al minuto o al giorno) e valore
      const quotaWhy = t => {
        const id = (/"quotaId"\s*:\s*"([^"]+)"/.exec(t) || /quotaId\W+([\w-]+)/.exec(t) || [])[1];
        const lim = (/limit:\s*(\d+)/i.exec(t) || /"quotaValue"\s*:\s*"(\d+)"/.exec(t) || [])[1];
        const kind = /PerDay|per day|daily/i.test(t) ? 'al giorno' : /PerMinute|per minute/i.test(t) ? 'al minuto' : 'periodo non indicato';
        const what = /token/i.test(t) ? 'token' : 'richieste';
        return `${what}, ${kind}${lim ? `, limite ${lim}` : ''}${id ? ` (${id})` : ''}`;
      };
      GEM_MODELS.forEach(m => {
        const used = stNow.req[m] || 0, until = blNow[m] || 0, lf = until - tNow;
        const state = lf <= 0 ? (used >= GEM_RPD ? 'Limite raggiunto' : 'Disponibile') : gemUnavailable(m) ? 'Non disponibile sul tuo account' : lf > 5 * 60000 ? `Bloccato fino alle ${gemResetTime()}` : 'In pausa un minuto';
        ca.appendChild(famRow(GEM_MODEL_NAMES[m] || m, `${used} di ${GEM_RPD} richieste usate. ${state}.`, null));
        const er = (store.get('gemErr') || {})[m];
        if(lf > 0 && !(er && /^429/.test(er.s) && tNow - er.at < 2 * 864e5)) ca.appendChild(el('div', 'modelErr', 'Motivo del blocco non registrato: il blocco è stato salvato da una versione precedente. Usa "Sblocca e riprova" qui sotto: se Google rifiuta ancora, vedrai il motivo esatto.'));
        if(er && /^429/.test(er.s) && tNow - er.at < 2 * 864e5) ca.appendChild(el('div', 'modelErr', `Ultimo rifiuto di Google, ${new Date(er.at).toLocaleString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}: ${quotaWhy(er.t)}. Testo: ${er.t.slice(0, 260)}`));
      });
      const unb = el('button', 'wideBtn inCard', 'Sblocca e riprova');
      unb.onclick = () => {
        if(!confirm('Tolgo i blocchi salvati su questo telefono. Alla prossima lettura con voce Google l\'app prova di nuovo, e se Google rifiuta salvo il motivo. Procedo?')) return;
        store.del('gemBlocked'); store.del('gemErr'); setStatus('Blocchi tolti. Premi play con una voce Google: se Google rifiuta, il motivo comparirà qui.'); openSettings(null, true);
      };
      ca.appendChild(unb);
      const lg = (store.get('gemLog') || []).slice(-8).reverse();
      ca.appendChild(el('div', 'innerLabel', 'Ultime richieste'));
      if(!lg.length) ca.appendChild(el('p', 'cardNote', 'Ancora nessuna richiesta registrata. Da qui in poi le vedi qui.'));
      lg.forEach(r => ca.appendChild(famRow(`${new Date(r.t).toLocaleString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })} · ${GEM_MODEL_NAMES[r.m] || r.m || 'modello'}`, (r.err ? `${r.c} caratteri inviati, rifiutata da Google (${r.err === '408' ? 'nessuna risposta in tempo' : 'errore ' + r.err}).` : r.cut ? `${r.c} caratteri inviati, tornati solo ${fmtM(r.s / 60)} min di audio: Google ha tagliato.` : `${r.c} caratteri inviati, ${fmtM(r.s / 60)} min di audio.`) + (r.ms ? ` Risposta in ${r.ms < 90000 ? Math.round(r.ms / 1000) + ' s' : fmtM(r.ms / 60000) + ' min'}.` : ''), null)));
      const hist = store.get('gemHist') || {}, days = Object.keys(hist).sort().slice(-7).reverse();
      if(days.length){
        ca.appendChild(el('div', 'innerLabel', 'Ultimi giorni'));
        days.forEach(d => { const h = hist[d], n = Object.values(h.req || {}).reduce((a, b) => a + b, 0); ca.appendChild(famRow(new Date(d + 'T12:00:00').toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }), `${n} richieste, ${fmtMin(Math.round(h.secs / 60))} di audio${h.cut ? `, ${h.cut} tagliate` : ''}.`, null)); });
      }
      const save = () => { store.set('prefs', prefs); openSettings(null, true); };
      const ahead = isGem() ? readyAheadMinutes() : 0;
      ca.appendChild(switchRow('Prepara in anticipo da sola',
        `Con l'app aperta, anche in pausa, preparo fino a un'ora e mezza oltre il punto in cui sei: il limite non usato oggi lo ascolti domani.${gemAheadOn() && ahead ? ' Ora pronti circa ' + fmtMin(ahead) + '.' : ''}`,
        gemAheadOn(), on => { prefs.gemAhead = on; save(); if(on) setTimeout(gemTick, 300); }));
      ca.appendChild(switchRow('Se finisce il limite, continua con un\'altra voce',
        'La lettura non si ferma; quando il limite si azzera torno da sola alla voce Google.',
        !!prefs.gemFallback, on => { prefs.gemFallback = on; save(); }));
      if(prefs.gemFallback){
        // quale voce usare dopo Google
        const fb = fallbackVoice();
        const pref = prefs.fallbackVoice || '';
        ca.appendChild(el('div', 'innerLabel', 'Voce da usare dopo Google'));
        const pick = v => { prefs.fallbackVoice = v; save(); };
        ca.appendChild(option('Automatica', `La prima voce scaricata sul telefono, se no quella dell'iPhone. Ora: ${fb ? fb.name : 'nessuna'}`, !pref, () => pick('')));
        const ready = PIPER_VOICES.filter(v => readyVoices.has(v.id));
        ready.forEach(v => ca.appendChild(option(v.name, 'Scaricata sul telefono' + speedNote(v.id), pref === 'piper:' + v.id, () => pick('piper:' + v.id))));
        const sv = bestSysVoice();
        if(sv) ca.appendChild(option('Voce dell\'iPhone', sv.name + ' · a schermo bloccato potrebbe fermarsi', pref === 'sys', () => pick('sys')));
        if(!ready.length) ca.appendChild(el('p', 'cardNote inCardNote', 'Per una voce più naturale dopo Google, scaricane una qui sotto in Voci sul telefono: comparirà in questo elenco.'));
      }
      const out = el('button', 'textBtn', 'Scollega account Google');
      out.onclick = () => {
        if(!confirm('Scollegare le voci Google da questo telefono? Potrai riattivarle quando vuoi.')) return;
        store.del('gemKey');
        if(isGem()){ const alt = PIPER_VOICES.find(v => voiceReady(v.id)); const sys = systemVoices()[0]; if(alt) selectVoice('piper', alt.id); else selectVoice('sys', sys ? sys.voiceURI : ''); }
        refreshVoiceUI();
      };
      out.classList.add('sectionEnd');
      section.appendChild(out);
    }

    // sul telefono
    const cp = card('Voci sul telefono', 'Funzionano anche offline, dopo il download.');
    PHONE_GROUPS.forEach(g => {
      const ready = voiceReady(g.ids[0]);
      const dl = downloading.has(g.key);
      cp.appendChild(famRow(g.title, ready ? 'Pronta' : dl ? 'Download in corso...' : g.size,
        ready ? 'Rimuovi' : dl ? 'Attendi' : 'Scarica', () => ready ? removeGroup(g) : downloadGroup(g), dl && !ready));
      if(ready) g.ids.forEach(id => {
        const v = PIPER_VOICES.find(x => x.id === id);
        const sel = state.engine === 'piper' && state.piperVoice === id;
        const r = voiceRow(v.name, speedNote(id).replace(/^ · /, '') || v.engine, sel, () => selectVoice('piper', id), b => previewVoice('piper', id, b), 'piper:' + id);
        r.classList.add('sub'); cp.appendChild(r);
      });
    });

    // iPhone
    const it = systemVoices();
    const ci = card(IS_IOS ? 'Voci dell\'iPhone' : 'Voci di sistema', 'Sempre pronte.');
    it.forEach(v => {
      const sel = state.engine === 'sys' && state.sysVoice && state.sysVoice.voiceURI === v.voiceURI;
      ci.appendChild(voiceRow(v.name, /enhanced|premium|avanzat|migliorat/i.test(v.name) ? 'Avanzata' : 'Di sistema', sel, () => selectVoice('sys', v.voiceURI), b => previewVoice('sys', v.voiceURI, b), 'sys:' + v.voiceURI));
    });
    // iPhone passa alle pagine web solo alcune voci: lo dico chiaro, senza istruzioni che non funzionano
    ci.appendChild(el('p', 'cardNote', it.length ? `Qui compaiono le voci italiane che ${SYS_NAME} passa a SiMa: ora ${it.length === 1 ? 'una' : it.length}.${IS_IOS ? ' Le voci aggiunte in Impostazioni di iPhone non sempre arrivano alle app web.' : ''}` : `${SYS_NAME} non passa a SiMa nessuna voce italiana.${IS_IOS ? ' Le voci aggiunte in Impostazioni di iPhone non sempre arrivano alle app web.' : ' Aggiungine una nelle impostazioni di sintesi vocale del telefono e riapri l\'app.'}`));

  } else if(settingsTab === 'play'){
    const cb = card('Pulsanti accanto a play', 'Valgono anche per cuffie e schermata di blocco.');
    [['frase', 'Una frase'], ['15', '15 secondi'], ['30', '30 secondi']].forEach(([k, label]) => {
      cb.appendChild(option(label, null, skipMode() === k, () => { prefs.skip = k; store.set('prefs', prefs); renderSkipButtons(); openSettings(null, true); }));
    });
    const cc = card('Pulsanti esterni');
    cc.appendChild(famRow('Capitolo precedente e successivo', 'A metà capitolo, Indietro torna prima al suo inizio.', null));
  } else {
    const cbk = card('Backup', 'Salva in un file i libri, il punto in cui sei arrivato, le note e le impostazioni. Tienilo in File o su iCloud Drive: se togli l\'app dalla Home o cambi telefono, lo ripristini da qui. La chiave Google non viene salvata nel file.');
    const lb = store.get('lastBackup');
    const bkRow = famRow('Salva un backup', lb ? 'Ultimo: ' + new Date(lb).toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' }) : 'Non hai ancora fatto un backup.', 'Salva', e => saveBackup(e.currentTarget));
    cbk.appendChild(bkRow);
    cbk.appendChild(famRow('Ripristina da un backup', 'Scegli il file .simabackup salvato prima.', 'Scegli', () => $('bkFile').click()));
    const ct = card('Aspetto', 'Automatico segue il tema scelto sull\'iPhone. Chiaro e Scuro restano fissi.');
    [['auto', 'Automatico', 'Come l\'iPhone'], ['light', 'Chiaro', null], ['dark', 'Scuro', null]].forEach(([k, label, sub]) => {
      ct.appendChild(option(label, sub, (prefs.theme || 'auto') === k, () => { prefs.theme = k; store.set('prefs', prefs); applyTheme(); openSettings(null, true); }));
    });
    // spazio
    const cs = card('Spazio');
    const audioMb = Math.round((store.get('audioBytes') || 0) / 1048576);
    const aheadMin = isGem() ? readyAheadMinutes() : 0;
    cs.appendChild(famRow('Audio già preparato', audioMb + ' MB' + (aheadMin ? ` · circa ${fmtMin(aheadMin)} pronti da ascoltare nel libro aperto` : '') + '. Quello già ascoltato si cancella per primo quando serve spazio.', audioMb ? 'Svuota' : null, clearAudioCache));
    const sb = Math.round(statsSize() / 1024);
    cs.appendChild(famRow('Statistiche di ascolto', (sb < 1 ? 'Meno di 1 KB' : sb + ' KB') + '. Servono per la scheda Statistiche.', sb ? 'Svuota' : null, clearStats));
    const tot = famRow('Spazio usato dall\'app', '...', null);
    cs.appendChild(tot);
    if(navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => { tot.querySelector('.famSub').textContent = Math.round((e.usage || 0) / 1048576) + ' MB tra libri, voci e audio'; }).catch(() => {});
    body.appendChild(el('p', 'version', `SiMa Player, versione ${APP_VERSION}. Si aggiorna da sola quando c'è connessione.`));
  }

  if(keepScroll) window.scrollTo(0, scroll); else window.scrollTo(0, 0);
}

function openMore(){
  const body = openSheet('more', 'Opzioni');
  bookCardEl().then(c => body.insertBefore(c, body.firstChild));
  const g1 = el('div', 'group');
  if(state.engine === 'piper'){
    const chaps = state.pages ? 20 : 2;
    const lastSec = Math.min(state.sections.length - 1, state.sec + chaps);
    const until = state.offsets[lastSec] + state.sections[lastSec].sentences.length - 1;
    g1.appendChild(gRow(SI.cloud, 'Prepara in anticipo', state.pages ? 'Genera ora la voce delle prossime 20 pagine' : 'Genera ora la voce dei prossimi 2 capitoli', () => {
      closeSheet(); state.prepareTo = until; requestWake();
      want(upcoming(lookahead()));
      setStatus('Preparazione avviata. Tieni l\'app aperta, anche in pausa: l\'avanzamento è sotto la barra del player.');
    }));
  }
  const nn = notes().length;
  g1.appendChild(gRow(SI.notes, 'Clip e note', null, () => openNotesList(), { pill: nn ? `${nn} ${nn === 1 ? 'nota' : 'note'}` : null }));
  g1.appendChild(gRow(SI.gear, 'Impostazioni', null, () => openSettings()));
  const g2 = el('div', 'group');
  g2.appendChild(gRow(SI.restart, 'Ricomincia dall\'inizio', null, () => { closeSheet(); goTo(0, 0); }, { end: SI.restart }));
  g2.appendChild(gRow(SI.done, 'Segna come finito', null, () => { closeSheet(); stop(); savePos(true); renderLibrary(); setStatus('Segnato come finito.'); }, { end: SI.done }));
  const g3 = el('div', 'group');
  g3.appendChild(gRow(SI.trash, 'Rimuovi dal telefono', 'Cancella il libro, la posizione e i segnalibri', async () => {
    if(!confirm(`Rimuovere "${state.meta.title}" dal telefono?`)) return;
    const k = state.key; closeSheet(); unloadBook();
    await lib.del(k); store.del('pos:' + k); store.del('notes:' + k); acache.delBook(k); renderLibrary();
  }, { danger: true, end: SI.arrowR }));
  body.append(g1, g2, g3);
}

/* ---------- eventi ---------- */
$('addBtn').onclick = () => $('file').click();
$('sVoice').onchange = e => { statsVoice = e.target.value; store.set('statsVoice', statsVoice); renderStats(); };
$('bkFile').onchange = e => { const f = e.target.files[0]; if(f) restoreBackup(f); e.target.value = ''; };
$('file').onchange = e => { const f = e.target.files[0]; if(f) addFile(f); e.target.value = ''; };
document.querySelectorAll('.chip').forEach(c => c.onclick = () => { filter = c.dataset.f; renderChips(); renderLibrary(); });
$('miniOpen').onclick = openPlayer;
$('miniPlay').onclick = togglePlay;
$('miniBack').onclick = () => skipBack();
$('pClose').onclick = closePlayer;
$('pMore').onclick = openMore;
$('bigPlay').onclick = togglePlay;
$('prevSent').onclick = () => skipBack();
$('nextSent').onclick = () => skipFwd();
document.querySelectorAll('.tabBtn').forEach(b => b.onclick = () => onTab(b.dataset.tab));
$('addBtn2').onclick = () => $('file').click();
$('rdSearch').onclick = openSearch;
$('libSearch').addEventListener('input', () => renderLibrary());
$('rdHintClose').onclick = () => $('rdHint').classList.add('hidden');
$('prevChap').onclick = () => moveChapter(-1);
$('nextChap').onclick = () => moveChapter(1);
$('chapBtn').onclick = openChapters;
$('speedBtn').onclick = openSpeed;
$('voiceBtn').onclick = openVoiceSheet;
$('textBtn').onclick = openReader;
$('nowText').onclick = openReader;
$('pMark').onclick = bookmarkCurrent;
$('rdMark').onclick = bookmarkCurrent;
$('rdClose').onclick = closeReader;
$('rdNotes').onclick = openNotesList;
$('rdPlay').onclick = togglePlay;
$('rdFollow').onclick = () => { reader.follow = true; $('rdFollow').classList.add('hidden'); markReader(true); };
$('sheetClose').onclick = closeSheet;
// trascinare sullo sfondo o sull'intestazione del pannello non fa scorrere nulla
['sheetBack', 'sheet'].forEach(id => $(id).addEventListener('touchmove', e => { if(!e.target.closest('#sheetBody')) e.preventDefault(); }, { passive: false }));
$('sheetBack').onclick = closeSheet;
const seekEl = $('seek');
seekEl.addEventListener('input', () => {
  seeking = true;
  const g = +seekEl.value;
  seekEl.style.setProperty('--p', (state.total > 1 ? g / (state.total - 1) * 100 : 0) + '%');
  seekText(g);
});
seekEl.addEventListener('change', () => {
  seeking = false;
  const p = fromG(+seekEl.value);
  goTo(p.sec, p.idx);
});
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ if(sheetKind) closeSheet(); else if(reader.open) closeReader(); else closePlayer(); } });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && sheetKind === 'gemSetup'){ const gs = store.get('gemSetup'); if(gs && gs.step !== gemSetup.step) openGemSetup(null, gs.step); }
  if(document.visibilityState === 'visible' && state.playing) requestWake();
  if(document.visibilityState === 'hidden') savePos();
});
window.addEventListener('pagehide', () => savePos());
// con l'app aperta, anche in pausa, continuo a preparare le parti Google (ad esempio dopo l'azzeramento del limite)
function gemTick(){
  if(!state.playing) maybeLeaveFallback();
  if(!isGem() || !state.total || !gemAheadOn() || busy || !gemModelsLeft() || state.prepareTo != null) return;
  if(document.visibilityState !== 'visible' && !state.playing) return;
  want(upcoming(lookahead()), audio.dataset.key);
}
setInterval(gemTick, 5 * 60000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') setTimeout(gemTick, 1500); });

/* ---------- avvio ---------- */
function restoreVoice(){
  // uso la voce scelta solo se è pronta; altrimenti una voce pronta, così l'app non parte mai con un download pesante
  const pv = prefs.voice || '';
  const id = pv.startsWith('piper:') ? pv.slice(6) : null;
  const sysList = systemVoices();
  if(pv.startsWith('sys:')){
    state.engine = 'sys'; state.sysVoice = sysList.find(x => x.voiceURI === pv.slice(4)) || state.sysVoice || sysList[0] || null;
  } else if(id && ((isGemId(id) && store.get('gemKey')) || (PIPER_VOICES.some(v => v.id === id) && (voiceReady(id) || downloading.has(familyKey(id)))))){
    state.engine = 'piper'; state.piperVoice = id;
  } else {
    const alt = PIPER_VOICES.find(v => voiceReady(v.id));
    if(store.get('gemKey')){ state.engine = 'piper'; state.piperVoice = GEM_VOICES[0].id; }
    else if(alt){ state.engine = 'piper'; state.piperVoice = alt.id; }
    else { state.engine = 'sys'; state.sysVoice = sysList[0] || null; }
  }
  $('voiceLabel').textContent = voiceName();
  syncMediaHandlers();
  if(state.total) refreshPosition(false);
}
if(prefs.rate) state.rate = +prefs.rate;
$('speedLabel').textContent = fmtRate(state.rate);
restoreVoice();
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { if(!state.playing) restoreVoice(); refreshVoiceUI(); };
// iPhone aggiorna l'elenco delle voci solo quando la pagina si riapre: rileggo la lista ogni volta che torno nell'app
document.addEventListener('visibilitychange', () => { if(!document.hidden && 'speechSynthesis' in window){ speechSynthesis.getVoices(); setTimeout(() => { if(view === 'set') openSettings(null, true); refreshVoiceUI(); }, 400); } });
updatePlay();
renderSkipButtons();
renderChips();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
(async () => {
  const gs = store.get('gemSetup');
  if(gs && !store.get('gemKey')){ gemSetup.voice = gs.voice; gemSetup.step = gs.step; }
  const before = state.engine === 'piper' ? state.piperVoice : null;
  const lost = await verifyVoices();
  restoreVoice();
  if(before && lost.includes(before)){
    const v = PIPER_VOICES.find(x => x.id === before);
    setStatus(`${v ? v.name : 'La voce scelta'} non è più sul telefono, quindi uso ${voiceName() || 'la voce dell\'iPhone'}. Puoi riscaricarla da Impostazioni > Voci.`, true);
  }
  const last = store.get('lastBook');
  if(last) await loadBook(last);
  await renderLibrary();
  // preparo in memoria la voce scelta, solo se è già sul telefono e non è troppo pesante
  if(state.engine === 'piper' && !isGem() && familyOf(state.piperVoice) !== 'supertonic' && voiceReady(state.piperVoice)) wk(state.piperVoice).postMessage({ type: 'prepare', voiceId: state.piperVoice });
  if(gs && !store.get('gemKey') && gs.step >= 3){ openPlayer(); openGemSetup(gs.voice, gs.step); }
})();
