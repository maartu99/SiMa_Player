<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SiMa Player</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SiMa Player">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="themeColor" content="#0F0F10">
<script>
// tema prima di disegnare la pagina: niente lampo di colore sbagliato all'apertura
(function(){
  var t = 'auto'; try{ t = (JSON.parse(localStorage.getItem('lettore:prefs')) || {}).theme || 'auto'; }catch(e){}
  var dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  var m = document.getElementById('themeColor'); if(m) m.content = dark ? '#0B0B0D' : '#FCF8FB';
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --serif:'Newsreader', ui-serif, Georgia, serif;
  --sans:'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
}
/* tema scuro (Stitch "Nocturne Editorial") */
:root, :root[data-theme="dark"]{
  --bg:#0B0B0D; --surface:#1C1C1E; --surface2:#252528; --sheet:#1B1B1D; --card:#262628; --card2:#2C2C2E;
  --line:#2C2C2E; --line2:#38383A; --track:#2C2C2E;
  --ink:#F5F5F7; --ink2:#D1D1D6; --muted:#8E8E93; --faint:#636366;
  --accent:#FF2D55; --accent-ink:#FFFFFF; --accent-soft:rgba(255,45,85,.15); --accent-line:rgba(255,45,85,.3); --accent-text:#FF617D;
  --mark-bg:rgba(255,45,85,.2); --mark-ink:#FFFFFF; --bookmark:#FBBF24; --err:#FF6B6B;
  --chip-on:#FFFFFF; --chip-on-ink:#000000;
  --toast:#2C2C2E; --toast-ink:#F5F5F7; --toast-err:#4A1F27; --toast-err-ink:#FFC9C2;
  --bar:rgba(0,0,0,.88); --glass:rgba(28,28,30,.9);
  --shadow:0 10px 30px rgba(0,0,0,.8); --soft-shadow:none; --cover-shadow:0 16px 36px rgba(0,0,0,.65); --play-shadow:0 8px 28px rgba(255,45,85,.45);
  --scrim:rgba(0,0,0,.6);
  color-scheme: dark;
}
/* tema chiaro (Stitch "Editorial Audio & Reader") */
:root[data-theme="light"]{
  --bg:#FCF8FB; --surface:#FFFFFF; --surface2:#F6F3F5; --sheet:#FCF8FB; --card:#FFFFFF; --card2:#F0EDEF;
  --line:#F0EDEF; --line2:#E4E2E4; --track:#EAE7EA;
  --ink:#1B1B1D; --ink2:#3A3436; --muted:#76696A; --faint:#916E6F;
  --accent:#E51245; --accent-ink:#FFFFFF; --accent-soft:rgba(229,18,69,.08); --accent-line:rgba(229,18,69,.25); --accent-text:#BA0034;
  --mark-bg:rgba(229,18,69,.12); --mark-ink:#7A0020; --bookmark:#D97706; --err:#BA1A1A;
  --chip-on:#1B1B1D; --chip-on-ink:#FFFFFF;
  --toast:#1B1B1D; --toast-ink:#FFFFFF; --toast-err:#BA1A1A; --toast-err-ink:#FFFFFF;
  --bar:rgba(252,248,251,.88); --glass:rgba(255,255,255,.9);
  --shadow:0 8px 28px rgba(60,20,30,.12); --soft-shadow:0 1px 6px rgba(60,20,30,.06); --cover-shadow:0 16px 36px rgba(60,20,30,.22); --play-shadow:0 8px 24px rgba(229,18,69,.35);
  --scrim:rgba(20,10,15,.32);
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,a,input,select,label{touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none !important}
/* testo a tutta pagina */
#reader{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column}
.rdTop{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.rdChapTitle{flex:1;min-width:0;text-align:center;font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdChapTitle::before{content:"In lettura";display:block;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);margin-bottom:1px}
.rdNotesBtn{position:relative}
.rdNotesBtn b{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;text-align:center}
.rdNotesBtn b:empty{display:none}
#rdBody{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 22px 140px;touch-action:pan-y}
.rdChapHead{text-align:center;margin:40px 0 22px}
.rdEyebrow{display:flex;align-items:center;justify-content:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent)}
.rdEyebrow::before,.rdEyebrow::after{content:"";width:22px;height:1px;background:var(--accent);opacity:.6}
.rdChapH{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--ink);margin:8px 0 6px;line-height:1.15;letter-spacing:-.3px}
.rdChapTime{font-size:12px;color:var(--muted)}
#rdBody p{font-family:var(--serif);font-size:19px;line-height:1.6;margin:0 auto 1em;color:var(--ink);max-width:640px;text-align:justify;-webkit-hyphens:auto;hyphens:auto}
#rdBody .s{border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background .15s}
#rdBody .s.noted{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
#rdBody .s.on{background:var(--mark-bg);color:var(--mark-ink);box-shadow:none}
#rdBody .s.press{background:var(--surface)}
.rdHint{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);max-width:520px;margin:0 auto;padding:10px 14px;border-radius:12px;background:var(--toast);color:var(--toast-ink);font-size:14px;line-height:1.4;text-align:center;box-shadow:var(--shadow)}
.rdBottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,var(--bg) 35%)}
.rdSpacer{flex:1}
.rdFollow{height:44px;padding:0 18px;border-radius:22px;border:0;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.rdPlay{width:56px;height:56px;border-radius:28px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px var(--accent-soft);display:flex;align-items:center;justify-content:center}
.pTopRight{display:flex;gap:8px}
#nowText{width:calc(100% - 48px);text-align:left;border:0;cursor:pointer}
/* note */
.noteQuote{font-family:var(--serif);font-size:17px;line-height:1.55;color:var(--ink);background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;margin:4px 0 6px}
.noteWhere{font-size:13px;color:var(--muted);margin:0 0 14px}
.noteArea{width:100%;box-sizing:border-box;min-height:110px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font:inherit;font-size:16px;line-height:1.45;padding:12px;resize:vertical;margin:0 0 12px}
.noteItem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:14px 0}
.noteItem small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.noteItem q{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-family:var(--serif);font-size:16px;line-height:1.45;quotes:none}
.noteItem span{display:block;font-size:14px;color:var(--accent);margin-top:6px;white-space:pre-wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{flex:none}

/* ---------- libreria ---------- */
#libView{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px 160px}
.libHead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.libHead h1{margin:0;font-family:var(--serif);font-weight:600;font-size:38px;letter-spacing:-.6px;line-height:1.05}
#libCount{font-size:14px;color:var(--muted);margin-top:4px;display:block}
.headBtns{display:flex;gap:8px;align-items:center}
.secTitle{font-family:var(--serif);font-size:21px;font-weight:600;margin:22px 0 6px;scroll-margin-top:8px}
#sheetBody>.secTitle:first-child{margin-top:4px}
.famRow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.famText{flex:1;min-width:0}
.famTitle{font-weight:600}
.famSub{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.tabs{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:0 0 6px;border-radius:12px;background:var(--card);box-shadow:0 8px 12px -6px var(--sheet)}
.tab{height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:16px;font-weight:600}
.tab[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--soft-shadow)}
.cardTitle{font-size:20px;font-weight:700;margin:30px 2px 4px}
.setSection{background:var(--sheet);border:1px solid var(--line2);border-radius:20px;padding:2px 12px 12px;margin:16px 0 0}
.setSection>.cardTitle{margin:16px 4px 4px}
.setSection>.cardNote{margin:0 4px 10px}
.setSection .card{margin:0}
.subTitle{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin:0 4px 6px;padding:16px 0 0 10px;border-top:1px solid var(--line2);position:relative}
.subTitle::before{content:'';position:absolute;left:0;top:17px;width:3px;height:12px;border-radius:2px;background:var(--accent)}
.setSection>.cardNote+.subTitle{border-top:0;padding-top:4px}
.setSection>.cardNote+.subTitle::before{top:5px}
.subTitle+.cardNote{margin:0 4px 8px}
.modelRow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.modelRow .modelName{color:var(--ink);font-weight:600;flex:none}
.modelRow .modelState{color:var(--muted);text-align:right}
.modelRow.ok .modelState{color:var(--accent)}
.modelErr{font-size:12px;color:var(--faint);line-height:1.4;padding:0 0 8px;word-break:break-word}
.subTitle+.card{margin-top:0}
.innerLabel{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:16px 0 4px}
.inCardNote{margin:10px 0 12px}
.textBtn.sectionEnd{border-top:0;margin-top:10px;padding:0 2px}
.switchRow{cursor:pointer}
.swWrap{display:flex;align-items:center;gap:8px;flex:none}
.swState{font-size:13px;font-weight:600;color:var(--muted);min-width:44px;text-align:right}
.switch{position:relative;width:51px;height:31px;border-radius:16px;border:0;padding:0;background:var(--line2);flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.swWrap:has(.switch[aria-checked="true"]) .swState{color:var(--accent)}
.cardNote{font-size:15px;color:var(--muted);margin:0 2px 8px;line-height:1.4}
.cardTitle+.card{margin-top:8px}
.card{background:var(--card);border-radius:16px;padding:0 14px;margin:0 0 4px}
.card>:last-child{border-bottom:0}
.card .opt,.card .voiceRow,.card .famRow{border-bottom:1px solid var(--line)}
.card .voiceRow .opt{border-bottom:0}
.card .voiceRow.sub{padding-left:14px}
.card .famTitle{font-size:16px}
.card .famSub{font-size:14px}
.wideBtn.inCard{margin:14px 0}
.presets.inCard{margin:14px 0}
.textBtn{display:block;width:100%;min-height:48px;border:0;border-top:1px solid var(--line);background:none;color:var(--err);font-size:15px;font-weight:600;text-align:left;padding:0}
.tip{padding:12px 0;font-size:15px;color:var(--muted)}
.tip summary{color:var(--accent);font-weight:600;cursor:pointer}
.tip p{margin:8px 0 0;line-height:1.45}
.version{font-size:13px;color:var(--faint);text-align:center;margin:28px 0 8px}
.badge{display:inline-block;vertical-align:middle;margin-left:4px;padding:3px 8px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:none}
.recCard{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left;margin:6px 0 10px;padding:16px;border-radius:16px;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--ink)}
.recTop{display:flex;align-items:center;gap:6px}
.recTitle{font-size:17px;font-weight:700}
.recText{font-size:15px;line-height:1.45;color:var(--ink2)}
.recCta{font-size:15px;font-weight:700;color:var(--accent);margin-top:2px}
.moreVoices{width:100%;display:flex;align-items:center;gap:14px;margin:18px 0 6px;padding:14px;border-radius:14px;border:1px dashed var(--line2);background:transparent;color:var(--accent);text-align:left;font-weight:600}
.moreVoices .ot span{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.addBtn{height:44px;padding:0 18px 0 14px;gap:6px;border-radius:22px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none;font-size:15px;font-weight:700;box-shadow:0 6px 16px var(--accent-soft)}
.chips{display:flex;gap:8px;padding:18px 0 14px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:18px;border:0;background:var(--surface);box-shadow:var(--soft-shadow);color:var(--ink2);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px;margin:0 0 12px;border-radius:18px;background:var(--surface);box-shadow:var(--soft-shadow)}
.rowMain{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:left}
.rowText{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.rowTitle{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowAuthor{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:8px;margin-top:3px}
.bar{flex:1;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--muted)}
.row.current .bar>i{background:var(--accent)}
.pct{font-size:12px;color:var(--muted);min-width:30px;text-align:right}
.rowLabel{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.current .rowLabel{color:var(--accent);font-weight:600}
.row.current .rowTitle::before{content:"In ascolto";display:block;font-size:10px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.rowBtns{display:flex;flex-direction:column;align-items:center;gap:6px}
.playCirc{width:48px;height:48px;border-radius:24px;border:1.5px solid var(--line2);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center}
.playCirc.on{border:0;background:var(--accent);color:var(--accent-ink)}
.delBtn{width:44px;height:32px;border:0;background:transparent;color:var(--faint);display:flex;align-items:center;justify-content:center}
.empty{padding:56px 4px 0;color:var(--muted);line-height:1.55}
.empty h2{font-family:var(--serif);font-weight:600;font-size:28px;color:var(--ink);margin:0 0 .5em}

/* ---------- copertine ---------- */
.cover{flex:none;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--serif);font-weight:600;line-height:1.08;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.cover .ct{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4}
.cover .cl{display:block;border-radius:2px}
.cover.s{width:64px;height:90px;padding:8px 7px;font-size:11px;border-radius:8px;box-shadow:var(--soft-shadow)}
.cover.s .cl{height:3px;width:22px}
.cover.xs{width:44px;height:60px;padding:5px;font-size:8px;border-radius:5px}
.cover.xs .cl{display:none}
.cover.l{width:196px;height:272px;padding:20px 18px;font-size:28px;border-radius:12px;box-shadow:var(--cover-shadow)}
.cover.l .cl{height:4px;width:40px}
.cover .ca{font-family:var(--sans);font-size:13px;font-weight:600;margin-top:8px}

/* ---------- mini player ---------- */
#mini{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:20;max-width:540px;margin:0 auto;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.miniRow{display:flex;align-items:center;gap:12px;padding:10px}
#miniOpen{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.miniText{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#miniTitle{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#miniSub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconBtn{width:44px;height:44px;border:0;background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;border-radius:22px}
.miniPlay{width:48px;height:48px;border-radius:24px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.miniBar{height:3px;background:var(--track)}
.miniBar>i{display:block;height:100%;background:var(--accent);width:0}

/* ---------- player ---------- */
#playerView{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#playerView.open{transform:none;visibility:visible}
@media (prefers-reduced-motion: reduce){#playerView{transition:none}}
.pInner{max-width:480px;margin:0 auto;height:100%;box-sizing:border-box;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 14px)}
.pInner>*{flex-shrink:0}
.pTop{display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.roundBtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--surface);color:var(--ink);box-shadow:var(--soft-shadow);display:flex;align-items:center;justify-content:center}
.pTopLabel{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:7px 12px;border-radius:999px}
.pCoverWrap{flex:1 1 0;min-height:72px;max-height:390px;display:flex;justify-content:center;align-items:center;padding:12px 0 0;container-type:size}
/* la copertina si adatta allo spazio: tutto il player sta in una schermata */
.pCoverWrap .cover.l{height:min(100cqh,370px);width:auto;aspect-ratio:196/272;max-width:80%;padding:min(9cqh,33px) min(7cqh,26px);font-size:min(9cqh,30px)}
.pCoverWrap .cover.l .cl{height:min(1.4cqh,5px);width:min(14cqh,52px)}

<script>
// se la libreria PDF non si carica (es. offline al primo avvio) il resto dell'app funziona lo stesso
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const APP_VERSION = 58;
if('serviceWorker' in navigator){
  // quando arriva una versione nuova dell'app la carico subito, se non stai ascoltando
  let hadController = !!navigator.serviceWorker.controller, reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!hadController){ hadController = true; return; }
    if(reloading) return;
    const apply = () => { if(reloading) return; reloading = true; try{ savePos(); }catch(e){} location.reload(); };
    if(typeof state !== 'undefined' && state.playing){
      setStatus('È disponibile una versione nuova dell\'app: la carico alla prossima pausa.', false);
      const wait = setInterval(() => { if(!state.playing){ clearInterval(wait); apply(); } }, 1000);
    } else apply();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      // controllo aggiornamenti anche quando l'app torna in primo piano
      document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
  });
}

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; };
const ICON = {
  play: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  pause: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>',
  tick: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
const big = s => s.replace('width="20" height="20"', 'width="34" height="34"');

const PIPER_VOICES = [
  { id: 'kokoro-if_sara', name: 'Sara', engine: 'Kokoro', size: 'circa 130 MB' },
  { id: 'kokoro-im_nicola', name: 'Nicola', engine: 'Kokoro', size: 'circa 130 MB' },
  { id: 'it_IT-paola-medium', name: 'Paola', engine: 'Piper', size: 'circa 60 MB' },
  { id: 'it_IT-riccardo-x_low', name: 'Riccardo', engine: 'Piper', size: 'circa 20 MB' },
  { id: 'st-F1', name: 'Donna 1', engine: 'Supertonic, sperimentale', size: 'circa 400 MB' },
  { id: 'st-F2', name: 'Donna 2', engine: 'Supertonic, sperimentale', size: 'circa 400 MB' },
  { id: 'st-M1', name: 'Uomo 1', engine: 'Supertonic, sperimentale', size: 'circa 400 MB' },
  { id: 'st-M2', name: 'Uomo 2', engine: 'Supertonic, sperimentale', size: 'circa 400 MB' }
];
// voci Google Gemini (online, chiave gratuita personale)
const GEM_VOICES = [
  { id: 'gem-Sulafat', name: 'Sulafat', desc: 'calda' },
  { id: 'gem-Achernar', name: 'Achernar', desc: 'morbida' },
  { id: 'gem-Vindemiatrix', name: 'Vindemiatrix', desc: 'gentile' },
  { id: 'gem-Aoede', name: 'Aoede', desc: 'leggera' },
  { id: 'gem-Kore', name: 'Kore', desc: 'decisa' },
  { id: 'gem-Algieba', name: 'Algieba', desc: 'vellutata' },
  { id: 'gem-Charon', name: 'Charon', desc: 'informativa' },
  { id: 'gem-Gacrux', name: 'Gacrux', desc: 'matura' },
  { id: 'gem-Iapetus', name: 'Iapetus', desc: 'chiara' },
  { id: 'gem-Puck', name: 'Puck', desc: 'vivace' }
];
const GEM_STYLES = {
  narrativa: { label: 'Narrativa', text: 'Lettura di un audiolibro in italiano: tono naturale e coinvolgente, ritmo pacato, intonazione che segue il senso del testo, le domande e i dialoghi.' },
  calma: { label: 'Calma', text: 'Lettura calma e rilassata di un audiolibro in italiano, voce morbida, ritmo lento e pause naturali.' },
  espressiva: { label: 'Espressiva', text: 'Lettura espressiva di un audiolibro in italiano, che interpreta con vivacità emozioni, tensione e dialoghi tra i personaggi.' }
};
// il telefono su cui gira l'app: le istruzioni cambiano tra iPhone e Android
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent || '');
const IS_ANDROID = /Android/.test(navigator.userAgent || '');
const SYS_NAME = IS_IOS ? 'iPhone' : IS_ANDROID ? 'Android' : 'telefono';
const isGemId = id => !!id && id.startsWith('gem-');
const isGem = () => state.engine === 'piper' && isGemId(state.piperVoice);
const state = {
  key: null, meta: null, sections: [], offsets: [], total: 0, isPdf: false,
  sec: 0, idx: 0, playing: false, gen: 0,
  rate: 1, engine: 'piper', piperVoice: PIPER_VOICES[0].id, sysVoice: null,
  charPos: 0, boundarySeen: false, prepareTo: null
};
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let wakeLock = null;

/* ---------- archivio locale ---------- */
const store = {
  get(k){ try{ const v = localStorage.getItem('lettore:' + k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem('lettore:' + k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('lettore:' + k); }catch(e){} }
};
let prefs = store.get('prefs') || {};
// pulsanti accanto a play: 'frase', 15 o 30 secondi
const SKIP_OPTS = { frase: 'Una frase alla volta', '15': '15 secondi', '30': '30 secondi' };
const skipMode = () => SKIP_OPTS[prefs.skip] ? prefs.skip : 'frase';

// i libri restano salvati sul telefono (IndexedDB)
const lib = {
  db: null,
  open(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('lettore', 2);
      r.onupgradeneeded = () => {
        const db = r.result;
        if(!db.objectStoreNames.contains('books')) db.createObjectStore('books', { keyPath: 'key' });
        if(!db.objectStoreNames.contains('audio')) db.createObjectStore('audio', { keyPath: 'k' }).createIndex('at', 'at');
      };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('books', mode); const st = t.objectStore('books');
      const out = fn(st);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  },
  put(b){ return this.tx('readwrite', st => st.put(b)); },
  async get(k){ const r = await this.tx('readonly', st => st.get(k)); return cleanRec(r); },
  async all(){ const l = await this.tx('readonly', st => st.getAll()); return (l || []).map(cleanRec); },
  del(k){ return this.tx('readwrite', st => st.delete(k)); }
};
// audio già generato, salvato sul telefono: ogni frase si genera una volta sola
// fino a 1 GB (circa 6 ore di voce Google), meno se il telefono concede poco spazio
let AUDIO_CAP = 1024 * 1024 * 1024;
try{ if(navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => { if(e && e.quota) AUDIO_CAP = Math.max(300 * 1048576, Math.min(AUDIO_CAP, e.quota * 0.4)); }).catch(() => {}); }catch(e){}
// la parte di un audio salvato: libro, capitolo e ultima frase che contiene
function audioSpot(k){
  const m = /^([^|]+)\|([^|]+)\|(\d+)\|(?:c\d+-)?(\d+)$/.exec(k || '');
  return m ? { voice: m[1], book: m[2], sec: +m[3], end: +m[4] } : null;
}
const acache = {
  async req(mode, fn){
    try{
      const db = await lib.open();
      return await new Promise(res => {
        const t = db.transaction('audio', mode); const r = fn(t.objectStore('audio'));
        t.oncomplete = () => res(r && r.result !== undefined ? r.result : null);
        t.onerror = () => res(null); t.onabort = () => res(null);
      });
    }catch(e){ return null; }
  },
  get(k){ return this.req('readonly', st => st.get(k)); },
  async put(k, blob, book){
    const ok = await this.req('readwrite', st => st.put({ k, blob, size: blob.size, book, at: Date.now() }));
    if(ok === null) return false;
    const bytes = (store.get('audioBytes') || 0) + blob.size;
    store.set('audioBytes', bytes);
    if(bytes > AUDIO_CAP) await this.prune();
    return true;
  },
  async prune(){
    // libera spazio fino all'80% del limite: prima l'audio già ascoltato, poi quello di altre voci,
    // poi il più vecchio; per ultimo quello ancora da ascoltare del libro aperto
    const db = await lib.open().catch(() => null); if(!db) return;
    const t = db.transaction('audio', 'readwrite'); const st = t.objectStore('audio');
    const items = [];
    await new Promise(res => { const c = st.openCursor(); c.onsuccess = () => { const cur = c.result; if(cur){ const v = cur.value; items.push({ k: v.k, size: v.size || 0, at: v.at || 0, book: v.book }); cur.continue(); } else res(); }; c.onerror = res; });
    let total = items.reduce((a, x) => a + x.size, 0);
    const curVoice = state.engine === 'piper' ? state.piperVoice : null;
    const rank = x => {
      const s = audioSpot(x.k); const pos = store.get('pos:' + x.book);

    const n = 24000, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 24000, true); v.setUint32(28, 48000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, n * 2, true);

  if(audio.src !== holdUrl){ audio.loop = true; audio.src = holdUrl; audio.removeAttribute('data-key'); }

async function gemCall(model, api, text, voice, style, key){

function sysSpeak(offset = 0){
  const g = ++state.gen;
  const s = state.sections[state.sec];
  const item = s && s.sentences[state.idx];
  if(!item){ stop(); return; }
  state.charPos = offset; state.boundarySeen = false;
  const u = new SpeechSynthesisUtterance(item.t.slice(offset));
  u.onboundary = e => { if(g !== state.gen) return; state.boundarySeen = true; state.charPos = offset + (e.charIndex || 0); };
  u.lang = state.sysVoice ? state.sysVoice.lang : 'it-IT';
  try{ if(state.sysVoice) u.voice = state.sysVoice; }catch(e){}
  u.rate = state.rate;
  u.onend = () => { if(g === state.gen && state.playing) advance(); };
  u.onerror = e => {
    if(g !== state.gen || e.error === 'interrupted' || e.error === 'canceled') return;
    if(state.playing) advance();
  };
  const wasBusy = speechSynthesis.speaking || speechSynthesis.pending;
  speechSynthesis.cancel();
  if(wasBusy) setTimeout(() => { if(g === state.gen) speechSynthesis.speak(u); }, 80);

}

function skipSeconds(d){

/* ---------- estrazione testo ---------- */
function splitSentences(text){
  text = text.replace(/\s+/g, ' ').trim();
  if(!text) return [];
  let parts = [];
  if(window.Intl && Intl.Segmenter){
    const seg = new Intl.Segmenter('it', { granularity: 'sentence' });
    for(const s of seg.segment(text)) parts.push(s.segment.trim());
  } else {
    parts = text.match(/[^.!?…]+(?:[.!?…]+["»”’)]*|$)/g) || [text];
  }
  const out = [];
  for(let p of parts){
    p = p.trim(); if(!p) continue;
    while(p.length > 280){
      let cut = p.lastIndexOf(', ', 280);
      if(cut < 80) cut = p.lastIndexOf(' ', 280);
      if(cut < 1) cut = 280;
      out.push(p.slice(0, cut + 1).trim());
      p = p.slice(cut + 1).trim();
    }
    if(p) out.push(p);
  }
  return out;
}
function paragraphsToSentences(paras){
  const out = [];
  for(const p of paras) splitSentences(p).forEach((t, i) => out.push({ t, p: i === 0 }));
  return out;
}

async function loadPdf(buf){
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
  let title = null, author = null;
  try{
    const md = await pdf.getMetadata();
    const info = (md && md.info) || {};
    if(info.Title && info.Title.trim().length > 2 && !/microsoft|untitled|\.docx?|\.pdf/i.test(info.Title)) title = info.Title.trim();
    if(cleanAuthor(info.Author)) author = info.Author.trim();
  }catch(e){}
  const secs = [];
  for(let i = 1; i <= pdf.numPages; i++){
    setStatus(`Preparo la pagina ${i} di ${pdf.numPages}...`, false, true);
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    const lines = []; let cur = '';
    for(const it of tc.items){
      cur += it.str;
      if(it.hasEOL){ lines.push(cur); cur = ''; }
    }
    if(cur) lines.push(cur);
    const paras = []; let b = '';
    for(let l of lines){
      l = l.trim();
      if(!l){ if(b){ paras.push(b); b = ''; } continue; }
      if(/^\d{1,4}$/.test(l)) continue;
      if(b.endsWith('-') && /^[a-zà-ÿ]/.test(l)) b = b.slice(0, -1) + l;
      else b += (b ? ' ' : '') + l;
    }
    if(b) paras.push(b);
    secs.push({ title: `Pagina ${i}`, sentences: paragraphsToSentences(paras) });
  }
  // se il PDF ha i segnalibri dei capitoli, raggruppo le pagine per capitolo
  try{
    const outline = await pdf.getOutline();
    let list = outline || [];
    if(list.length === 1 && list[0].items && list[0].items.length >= 2) list = list[0].items;
    const starts = [];
    for(const it of list){
      let dest = it.dest;
      if(typeof dest === 'string') dest = await pdf.getDestination(dest);
      if(!dest || !dest[0]) continue;
      const pi = typeof dest[0] === 'number' ? dest[0] : await pdf.getPageIndex(dest[0]);
      const label = (it.title || '').replace(/\s+/g, ' ').trim().slice(0, 80);
      if(label && !starts.some(x => x.page === pi)) starts.push({ page: pi, label });
    }
    starts.sort((a, b) => a.page - b.page);
    if(starts.length >= 2){
      const chaps = [];
      const group = (from, to, label) => {
        const sentences = [].concat(...secs.slice(from, to).map(x => x.sentences));
        if(sentences.length) chaps.push({ title: label, sentences });
      };
      if(starts[0].page > 0) group(0, starts[0].page, 'Inizio');
      starts.forEach((st, i) => group(st.page, i + 1 < starts.length ? starts[i + 1].page : secs.length, st.label));
      if(chaps.length >= 2) return { secs: chaps, title, author, cover: null, chapters: true };
    }
  }catch(e){ console.error(e); }
  return { secs, title, author, cover: null, chapters: false };
}

function resolvePath(base, href){
  const out = [];
  for(const p of (base + href).split('/')){
    if(p === '..') out.pop(); else if(p !== '.' && p !== '') out.push(p);
  }
  return out.join('/');
}
async function loadEpub(buf){
  const zip = await JSZip.loadAsync(buf);
  const cf = zip.file('META-INF/container.xml');
  if(!cf) throw new Error('EPUB non valido');
  const cdoc = new DOMParser().parseFromString(await cf.async('string'), 'application/xml');
  const opfPath = cdoc.getElementsByTagName('rootfile')[0].getAttribute('full-path');
  const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
  const opf = new DOMParser().parseFromString(await zip.file(opfPath).async('string'), 'application/xml');
  const manifest = {};
  let coverHref = null;
  for(const it of opf.getElementsByTagName('item')){
    manifest[it.getAttribute('id')] = it.getAttribute('href');
    if(/cover-image/.test(it.getAttribute('properties') || '')) coverHref = it.getAttribute('href');
  }
  if(!coverHref){
    for(const m of opf.getElementsByTagName('meta')){
      if(m.getAttribute('name') === 'cover' && manifest[m.getAttribute('content')]) coverHref = manifest[m.getAttribute('content')];
    }
  }
  let cover = null;
  if(coverHref && /\.(jpe?g|png|gif|webp)$/i.test(coverHref)){
    const cfile = zip.file(resolvePath(base, decodeURIComponent(coverHref)));
    if(cfile){
      const ext = coverHref.split('.').pop().toLowerCase();
      cover = new Blob([await cfile.async('uint8array')], { type: 'image/' + (ext === 'jpg' ? 'jpeg' : ext) });
    }
  }
  const pick = name => { const e = opf.getElementsByTagName('dc:' + name)[0] || opf.getElementsByTagNameNS('*', name)[0]; return e ? e.textContent.trim() : null; };
  const spine = [...opf.getElementsByTagName('itemref')];
  const toc = await readEpubToc(zip, opf, base, manifest);
  const secs = [];
  if(toc.length >= 2){
    // capitoli veri, presi dall'indice del libro
    const byFile = {};
    toc.forEach((t, i) => { (byFile[t.file] = byFile[t.file] || []).push({ i, frag: t.frag }); });
    let cur = { title: 'Inizio', paras: [] };
    const flush = () => { const sentences = paragraphsToSentences(cur.paras); if(sentences.length) secs.push({ title: cur.title, sentences }); };
    for(let k = 0; k < spine.length; k++){
      setStatus(`Preparo la sezione ${k + 1} di ${spine.length}...`, false, true);
      const href = manifest[spine[k].getAttribute('idref')];
      if(!href) continue;
      const path = resolvePath(base, decodeURIComponent(href.split('#')[0]));
      const f = zip.file(path); if(!f) continue;
      const doc = new DOMParser().parseFromString(await f.async('string'), 'text/html');
      if(!doc.body) continue;
      doc.querySelectorAll('script,style,sup a,nav').forEach(e => e.remove());
      // segno nel testo dove inizia ogni capitolo dell'indice
      (byFile[path] || []).forEach(({ i, frag }) => {
        const mark = doc.createTextNode('\u2029\u2063' + i + '\u2063\u2029');
        const target = frag ? doc.getElementById(frag) : null;
        if(target) target.before(mark); else doc.body.prepend(mark);
      });
      doc.body.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li,blockquote,div,br,tr,dt,dd')
        .forEach(e => e.after(doc.createTextNode('\u2029')));
      for(const raw of doc.body.textContent.split('\u2029')){
        const t = raw.trim(); if(!t) continue;
        const m = /^\u2063(\d+)\u2063$/.exec(t);
        if(m){ flush(); cur = { title: toc[+m[1]].label, paras: [] }; continue; }
        cur.paras.push(t);
      }
    }
    flush();
  } else {
    // nessun indice: un capitolo per ogni file del libro
    let n = 0;
    for(let k = 0; k < spine.length; k++){
      setStatus(`Preparo la sezione ${k + 1} di ${spine.length}...`, false, true);
      const href = manifest[spine[k].getAttribute('idref')];
      if(!href) continue;
      const f = zip.file(resolvePath(base, decodeURIComponent(href.split('#')[0])));
      if(!f) continue;
      const doc = new DOMParser().parseFromString(await f.async('string'), 'text/html');
      if(!doc.body) continue;
      doc.querySelectorAll('script,style,sup a,nav').forEach(e => e.remove());
      doc.body.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li,blockquote,div,br,tr,dt,dd')
        .forEach(e => e.after(doc.createTextNode('\u2029')));
      const paras = doc.body.textContent.split('\u2029').map(x => x.trim()).filter(Boolean);
      const sentences = paragraphsToSentences(paras);
      if(!sentences.length) continue;
      n++;
      const h = doc.querySelector('h1,h2,h3');
      let t = h ? h.textContent.replace(/\s+/g, ' ').trim() : '';
      if(t.length > 60) t = t.slice(0, 57) + '...';
      secs.push({ title: t || `Capitolo ${n}`, sentences });
    }
  }
  return { secs, title: pick('title'), author: cleanAuthor(pick('creator')), cover, chapters: true };
}
// legge l'indice dell'EPUB (nav di EPUB 3, oppure toc.ncx di EPUB 2)
async function readEpubToc(zip, opf, base, manifest){
  const items = [...opf.getElementsByTagName('item')];
  const clean = x => (x || '').replace(/\s+/g, ' ').trim();
  const resolveIn = (filePath, href) => {
    const dir = filePath.includes('/') ? filePath.slice(0, filePath.lastIndexOf('/') + 1) : '';
    const [f, frag] = href.split('#');
    return { file: resolvePath(dir, decodeURIComponent(f)), frag: frag ? decodeURIComponent(frag) : null };
  };
  const pickLevel = list => (list.length === 1 && list[0].kids.length >= 2) ? list[0].kids : list;
  try{
    const nav = items.find(it => /\bnav\b/.test(it.getAttribute('properties') || ''));
    if(nav){
      const path = resolvePath(base, decodeURIComponent(nav.getAttribute('href')));
      const doc = new DOMParser().parseFromString(await zip.file(path).async('string'), 'text/html');
      const navs = [...doc.querySelectorAll('nav')];
      const tocNav = navs.find(n => /toc/.test(n.getAttribute('epub:type') || n.getAttribute('type') || n.getAttribute('role') || '')) || navs[0];
      const ol = tocNav && tocNav.querySelector('ol');
      const walk = list => [...list.children].filter(li => li.tagName === 'LI').map(li => {
        const a = li.querySelector(':scope > a, :scope > span > a') || li.querySelector('a');
        const sub = li.querySelector(':scope > ol');
        return { label: clean(a && a.textContent), href: a && a.getAttribute('href'), kids: sub ? walk(sub) : [] };
      });
      if(ol){
        const out = pickLevel(walk(ol)).filter(x => x.href && x.label).map(x => ({ label: x.label.slice(0, 80), ...resolveIn(path, x.href) }));
        if(out.length) return out;
      }
    }
    const sp = opf.getElementsByTagName('spine')[0];
    const tocId = sp && sp.getAttribute('toc');
    const ncx = items.find(it => it.getAttribute('id') === tocId) || items.find(it => /ncx/.test(it.getAttribute('media-type') || ''));
    if(ncx){
      const path = resolvePath(base, decodeURIComponent(ncx.getAttribute('href')));
      const doc = new DOMParser().parseFromString(await zip.file(path).async('string'), 'application/xml');
      const map = doc.getElementsByTagName('navMap')[0];
      const walk = el => [...el.children].filter(c => c.localName === 'navPoint').map(np => {
        const lab = [...np.children].find(c => c.localName === 'navLabel');
        const con = [...np.children].find(c => c.localName === 'content');
        return { label: clean(lab && lab.textContent), href: con && con.getAttribute('src'), kids: walk(np) };
      });
      if(map) return pickLevel(walk(map)).filter(x => x.href && x.label).map(x => ({ label: x.label.slice(0, 80), ...resolveIn(path, x.href) }));
    }
  }catch(e){ console.error(e); }
  return [];
}

/* ---------- aggiunta libri ---------- */
async function parseBook(data, name, type){
  const isPdf = /\.pdf$/i.test(name) || type === 'application/pdf';
  if(isPdf ? !window.pdfjsLib : !window.JSZip) throw new Error('libreria non caricata');
  const res = isPdf ? await loadPdf(data) : await loadEpub(data);
  res.secs = res.secs.filter(s => s.sentences.length);
  res.isPdf = isPdf;
  return res;
}
async function addFile(file){
  const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
  const isEpub = /\.epub$/i.test(file.name) || file.type === 'application/epub+zip';
  if(!isPdf && !isEpub){ setStatus('Formato non supportato. Scegli un file PDF o EPUB.', true); return; }
  setStatus('Apro il file...', false, true);
  try{
    const buf = await file.arrayBuffer();
    if(!buf.byteLength) throw new Error('file vuoto');
    const saved = buf.slice(0); // copia da salvare, fatta prima di leggere il file
    const res = await parseBook(buf, file.name, file.type);
    if(!res.secs.length){
      setStatus(isPdf
        ? 'Questo PDF non contiene testo selezionabile: probabilmente è una scansione.'
        : 'Non ho trovato testo leggibile in questo EPUB.', true);
      return;
    }
    const key = hash(file.name + ':' + file.size);
    const rec = {
      key, name: file.name, type: isPdf ? 'application/pdf' : 'application/epub+zip',
      title: res.title || file.name.replace(/\.(pdf|epub)$/i, '').replace(/[_]+/g, ' '),
      author: res.author || null, cover: res.cover || null, isPdf, chapters: !!res.chapters,
      secs: res.secs, data: saved, size: saved.byteLength, added: Date.now(), v: 3
    };
    await lib.put(rec);
    const check = await lib.get(key);
    if(!check || !check.secs || !check.secs.length) throw new Error('verifica salvataggio fallita');
    setStatus(`"${rec.title}" aggiunto alla libreria.`);
    if(!state.key) await loadBook(key);
    filter = 'all'; renderChips();
    await renderLibrary();
  }catch(e){
    console.error(e);
    if(/libreria/.test(e.message || '')) setStatus('Per aprire un libro nuovo la prima volta serve la connessione a internet. Riprova quando sei online.', true);
    else setStatus('Non riesco ad aprire questo file. Potrebbe essere protetto o danneggiato.', true);
  }
}

/* ---------- caricamento del libro corrente ---------- */
async function loadBook(key){
  const rec = await lib.get(key);
  if(!rec) return false;
  let secs = rec.secs;
  if(!secs || !secs.length || (rec.v || 0) < 3){
    // libro salvato dalla versione precedente: lo analizzo e salvo il risultato
    let data = rec.data || (rec.blob && rec.blob.size ? await rec.blob.arrayBuffer() : null);
    if(!data || !data.byteLength){
      await lib.del(key);
      if(store.get('lastBook') === key) store.del('lastBook');
      setStatus('Il salvataggio di un libro era rovinato e l\'ho rimosso. Aggiungilo di nuovo: da ora resta salvato.', true);
      return false;
    }
    try{
      const res = await parseBook(data, rec.name, rec.type || (rec.blob && rec.blob.type));
      secs = res.secs;
      Object.assign(rec, { secs, isPdf: res.isPdf, chapters: !!res.chapters, author: rec.author || res.author, cover: rec.cover || res.cover, data: rec.data || data, v: 3 });
      delete rec.blob;
      await lib.put(rec);
      setStatus('');
    }catch(e){ console.error(e); setStatus('Non riesco ad aprire questo libro.', true); return false; }
  }
  if(state.playing) stop();
  state.key = key; state.meta = rec; state.sections = secs; state.isPdf = !!rec.isPdf; state.prepareTo = null;
  state.pages = state.isPdf && !rec.chapters; // PDF senza segnalibri: si naviga per pagine
  await recallChunks(key);
  state.offsets = []; let acc = 0;
  for(const s of secs){ state.offsets.push(acc); acc += s.sentences.length; }
  state.total = acc;
  // caratteri dall'inizio del libro a ogni frase: servono per stimare il tempo ascoltato e quello che manca
  state.cum = new Float64Array(acc + 1); { let i = 0; for(const s of secs) for(const it of s.sentences){ state.cum[i + 1] = state.cum[i] + it.t.length + 1; i++; } }
  audio.removeAttribute('data-key');
  want([]);
  const pos = store.get('pos:' + key);
  // la posizione è salvata come numero di frase nel libro: resta giusta anche se i capitoli cambiano
  if(pos && typeof pos.g === 'number' && pos.g < state.total){ const p = fromG(pos.g); state.sec = p.sec; state.idx = p.idx; }
  else if(pos && secs[pos.sec] && secs[pos.sec].sentences[pos.idx]){ state.sec = pos.sec; state.idx = pos.idx; }
  else { state.sec = 0; state.idx = 0; }
  store.set('lastBook', key);
  // mini player e player
  $('miniCover').textContent = ''; $('miniCover').appendChild(makeCover(rec, 'xs'));
  $('miniTitle').textContent = rec.title;
  $('pCover').textContent = ''; $('pCover').appendChild(makeCover(rec, 'l'));
  $('pTitle').textContent = rec.title;
  $('pAuthor').textContent = rec.author || '';
  $('pAuthor').classList.toggle('hidden', !rec.author);
  $('mini').classList.remove('hidden'); document.body.classList.remove('noMini');
  updatePlay(); refreshPosition(false); updateMedia();
  if(state.engine === 'piper') want(upcoming(lookahead()));
  return true;
}
function unloadBook(){
  if(reader.open) closeReader();
  stop();
  state.key = null; state.meta = null; state.sections = []; state.offsets = []; state.total = 0;
  store.del('lastBook');
  $('mini').classList.add('hidden'); document.body.classList.add('noMini');
  closePlayer();
}

let filter = store.get('filter') || 'all';
function renderChips(){
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.f === filter ? 'true' : 'false'));
  store.set('filter', filter);
}
function statusOf(key){
  const pos = store.get('pos:' + key);
  if(pos && pos.done) return { kind: 'done', pos };
  if(pos && pos.g > 0) return { kind: 'progress', pos };
  return { kind: 'new', pos };
}
async function renderLibrary(){
  let books = [];
  try{ books = await lib.all(); }catch(e){}
  const list = $('list'); list.textContent = '';
  $('libCount').textContent = books.length ? `${books.length} ${books.length === 1 ? 'libro' : 'libri'} sul telefono` : 'Nessun libro';
  const q = ($('libSearch').value || '').trim().toLowerCase();
  const items = books.map(b => ({ b, st: statusOf(b.key) }))
    .filter(x => filter === 'all' || x.st.kind === filter)
    .filter(x => !q || (x.b.title + ' ' + (x.b.author || '')).toLowerCase().includes(q))
    .sort((x, y) => ((y.st.pos && y.st.pos.at) || y.b.added) - ((x.st.pos && x.st.pos.at) || x.b.added));
  if(!books.length){
    const e = el('div', 'empty');
    e.appendChild(el('h2', null, 'Aggiungi il tuo primo libro'));
    e.appendChild(el('p', null, 'Tocca il pulsante + in alto e scegli un PDF o un EPUB dall\'app File. Resta salvato sul telefono e riparte sempre dalla frase in cui eri.'));
    list.appendChild(e); return;
  }
  if(!items.length){
    const e = el('div', 'empty');
    e.appendChild(el('p', null, q ? 'Nessun libro trovato.' : filter === 'done' ? 'Nessun libro finito.' : filter === 'new' ? 'Nessun libro da iniziare.' : 'Nessun libro in corso.'));
    list.appendChild(e); return;
  }
  for(const { b, st } of items){
    const pct = st.kind === 'done' ? 100 : (st.pos && st.pos.pct) || 0;
    const row = el('article', 'row' + (b.key === state.key ? ' current' : '')); row.dataset.key = b.key;
    const main = el('button', 'rowMain'); main.setAttribute('aria-label', `Apri ${b.title} nel player`);
    const cb = el('span', 'coverBox'); cb.appendChild(makeCover(b, 's'));
    const live = el('span', 'liveBadge'); live.innerHTML = '<i></i><i></i><i></i>'; cb.appendChild(live);
    main.appendChild(cb);
    const tx = el('span', 'rowText');
    const top = el('span', 'rowTop');
    top.appendChild(el('span', 'rowEyebrow', 'In ascolto'));
    top.appendChild(el('span', 'rowTitle', b.title));
    const au = el('span', 'rowAuthor', b.author ? b.author + ' · ' : ''); au.appendChild(el('em', null, b.isPdf ? 'PDF' : 'EPUB'));
    top.appendChild(au);
    tx.appendChild(top);
    const prog = el('span', 'rowProg');
    const pt = el('span', 'rowProgTop');
    const chap = st.kind === 'done' ? 'Finito' : (st.pos && st.pos.chap) || (st.kind === 'new' ? 'Inizio del libro' : '');
    pt.append(el('span', 'rowLabel', b.key === state.key && state.total ? chapterShort() : chap), el('span', 'pct' + (st.kind === 'new' ? ' new' : ''), st.kind === 'new' ? 'Da iniziare' : pct + '%'));
    const bar = el('span', 'bar'); const fill = el('i'); fill.style.width = pct + '%'; bar.appendChild(fill);
    prog.append(pt, bar);
    tx.appendChild(prog);
    main.appendChild(tx);
    main.onclick = async () => { if(b.key !== state.key && !(await loadBook(b.key))) return renderLibrary(); renderLibrary(); openPlayer(); };
    const pb = el('button', 'playCirc'); pb.dataset.key = b.key;
    pb.onclick = async () => {
      unlockAudio();
      if(b.key === state.key){ togglePlay(); return; }
      if(!(await loadBook(b.key))) return renderLibrary();
      await renderLibrary();
      play();
    };
    const removeBook = async () => {
      if(!confirm(`Rimuovere "${b.title}" dal telefono?`)) return;
      if(b.key === state.key) unloadBook();
      await lib.del(b.key); store.del('pos:' + b.key); store.del('notes:' + b.key); acache.delBook(b.key);
      if(coverUrls.has(b.key)){ URL.revokeObjectURL(coverUrls.get(b.key)); coverUrls.delete(b.key); }
      renderLibrary();
    };
    const kb = el('button', 'kebab'); kb.setAttribute('aria-label', `Altre azioni per ${b.title}`);
    kb.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>';
    kb.onclick = e => { e.stopPropagation(); openBookMenu(b, kb); };

      const lb = row.querySelector('.liveBadge'); if(lb) lb.style.display = on ? '' : 'none';
      const eb = row.querySelector('.rowEyebrow'); if(eb) eb.style.display = cur ? '' : 'none';
    }
  });
}

/* ---------- tema chiaro / scuro ---------- */
const darkQuery = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme(){
  const t = prefs.theme || 'auto';
  const dark = t === 'dark' || (t === 'auto' && darkQuery && darkQuery.matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

const reader = { open: false, first: -1, last: -1, follow: true, onEl: null };
function chapterEl(sec){
  const s = state.sections[sec];
  const wrap = el('div', 'rdChap'); wrap.dataset.sec = sec;
  const head = el('div', 'rdChapHead');
  const mins = Math.max(1, Math.round(s.sentences.reduce((a, x) => a + x.t.length + 1, 0) / cps() / 60));
  head.append(el('div', 'rdEyebrow', state.pages ? `Pagina ${sec + 1}` : `Capitolo ${sec + 1}`), el('h2', 'rdChapH', state.pages ? (s.title && s.title !== `Pagina ${sec + 1}` ? s.title : `Pagina ${sec + 1}`) : secLabel(sec)), el('div', 'rdChapTime', `Ascolto stimato: ${mins} min`));
  wrap.appendChild(head);
  const marked = new Set(notes().filter(n => n.sec === sec).map(n => n.idx));
  let p = null;
  s.sentences.forEach((x, i) => {
    if(x.p || !p){ p = el('p'); wrap.appendChild(p); }
    const sp = el('span', 's' + (marked.has(i) ? ' noted' : ''), x.t); sp.dataset.s = sec; sp.dataset.i = i;
    p.append(sp, document.createTextNode(' '));
  });
  return wrap;
}
function buildReaderAround(sec){
  const b = $('rdBody'); b.textContent = ''; reader.onEl = null;
  reader.first = reader.last = sec; b.appendChild(chapterEl(sec));
  appendChapter(); prependChapter(); fillReader();
}
// capitoli corti: aggiungo testo finché c'è abbastanza da scorrere in entrambe le direzioni
function fillReader(){
  const b = $('rdBody');
  let guard = 0;
  while(guard++ < 30 && reader.last < state.sections.length - 1 && b.scrollHeight - b.scrollTop - b.clientHeight < 1000) appendChapter();
  guard = 0;
  while(guard++ < 30 && reader.first > 0 && b.scrollTop < 700) prependChapter();
}
function prependChapter(){
  if(reader.first <= 0) return;
  const b = $('rdBody'), h = b.scrollHeight, top = b.scrollTop;
  b.insertBefore(chapterEl(reader.first - 1), b.firstChild); reader.first--;
  b.scrollTop = top + (b.scrollHeight - h);
}
function appendChapter(){
  if(reader.last >= state.sections.length - 1) return;
  $('rdBody').appendChild(chapterEl(reader.last + 1)); reader.last++;
}
function readerTitle(){
  const b = $('rdBody'), y = b.scrollTop + 80;
  let cur = null; b.querySelectorAll('.rdChap').forEach(c => { if(c.offsetTop <= y) cur = c; });
  $('rdChap').textContent = cur ? secLabel(+cur.dataset.sec) : '';
}
function markReader(scroll){
  if(!reader.open) return;
  if(state.sec < reader.first || state.sec > reader.last){
    if(!reader.follow) return;
    buildReaderAround(state.sec);
  }
  const sp = document.querySelector(`#rdBody .s[data-s="${state.sec}"][data-i="${state.idx}"]`);
  if(reader.onEl && reader.onEl !== sp) reader.onEl.classList.remove('on');

  requestAnimationFrame(() => { const sp = document.querySelector(`#rdBody .s[data-s="${state.sec}"][data-i="${state.idx}"]`); if(sp){ sp.classList.add('on'); reader.onEl = sp; sp.scrollIntoView({ block: 'center' }); } readerTitle(); });

}
function closeReader(){ reader.open = false; $('reader').classList.add('hidden'); $('rdBody').textContent = ''; reader.onEl = null; }
(function readerEvents(){
  const b = $('rdBody');
  b.addEventListener('scroll', () => {
    fillReader();
    readerTitle();
  }, { passive: true });
  // se scorri tu, smetto di seguire la lettura e compare il pulsante per tornarci
  const stopFollow = () => { if(reader.follow){ reader.follow = false; $('rdFollow').classList.remove('hidden'); } };
  b.addEventListener('touchmove', stopFollow, { passive: true });
  b.addEventListener('wheel', stopFollow, { passive: true });
  // tocco = ascolta da qui; pressione lunga = segnalibro
  let press = null;
  const cancel = () => { if(press){ clearTimeout(press.t); press.sp.classList.remove('press'); press = null; } };
  b.addEventListener('pointerdown', e => {
    const sp = e.target.closest('.s'); if(!sp) return;
    cancel();
    press = { sp, x: e.clientX, y: e.clientY, long: false };
    sp.classList.add('press');
    press.t = setTimeout(() => {
      if(!press) return; press.long = true; sp.classList.remove('press');

    }, 550);
  });
  b.addEventListener('pointermove', e => { if(press && (Math.abs(e.clientX - press.x) > 10 || Math.abs(e.clientY - press.y) > 10)) cancel(); });
  b.addEventListener('pointercancel', cancel);
  b.addEventListener('pointerup', () => {
    if(!press) return;
    const { sp, long } = press; cancel();
    if(long) return;
    jumpTo(+sp.dataset.s, +sp.dataset.i, true);
  });
  b.addEventListener('contextmenu', e => e.preventDefault());
})();

async function hasVoiceFiles(id){
  const fam = familyOf(id);

    if(fam === 'kokoro'){ const c = await caches.open('transformers-cache'); return (await c.keys()).some(r => /kokoro/i.test(r.url) && /\.onnx/.test(r.url)); }

async function verifyVoices(){

// i download in corso si ricordano: se iPhone li interrompe quando esci dall'app, ripartono da soli al ritorno
function dlPending(){ return store.get('dlPending') || []; }
function dlRemember(g){ const l = dlPending().filter(x => x.key !== g.key); l.push({ key: g.key, ids: g.ids, title: g.title, n: g.n || 0 }); store.set('dlPending', l); }

function downloadGroup(g){

  downloading.add(g.key); dlRemember(g);
  setStatus(`Scarico ${g.title}. Non cambiare app e tieni lo schermo acceso: se iPhone interrompe il download, riprende da solo quando torni qui.`, false, true);

// riparte dal punto in cui si era fermato: i file già scaricati restano nella cache del telefono
function dlResume(){
  // non tocco il motore mentre legge o genera: sarebbe proprio la voce che stai ascoltando
  if(state.playing || busy) return;
  const list = dlPending().filter(g => !readyVoices.has(g.ids[0]));
  if(!list.length) return;
  const g = list[0], fam = familyOf(g.ids[0]);
  // dopo tanti tentativi a vuoto smetto, così non riprova a ogni apertura
  g.n = (g.n || 0) + 1; store.set('dlPending', dlPending().map(x => x.key === g.key ? { ...x, n: g.n } : x));
  if(g.n > 6){ store.set('dlPending', dlPending().filter(x => x.key !== g.key)); setStatus(`Non riesco a finire il download di ${g.title}. Riprova più tardi con Scarica.`, true); return; }
  if(workers[fam]){ workers[fam].terminate(); delete workers[fam]; }
  busy = false; downloading.delete(g.key);
  setStatus(`Riprendo il download di ${g.title}...`, false, true);
  downloadGroup(g);
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) setTimeout(dlResume, 800); });

async function removeGroup(g){
  if(!confirm(`Rimuovere ${g.title} dal telefono? Potrai scaricarla di nuovo quando vuoi.`)) return;
  const fam = familyOf(g.ids[0]);
  if(workers[fam]){ workers[fam].terminate(); delete workers[fam]; busy = false; }
  try{
    if(fam === 'kokoro'){
      await caches.delete('kokoro-voices');
      const c = await caches.open('transformers-cache');
      for(const r of await c.keys()) if(/kokoro/i.test(r.url)) await c.delete(r);
    } else if(fam === 'supertonic'){
      await caches.delete('supertonic-3');
    } else {
      const root = await navigator.storage.getDirectory();
      const dir = await root.getDirectoryHandle('piper');
      for await (const name of dir.keys()) if(name.startsWith(g.ids[0])) await dir.removeEntry(name);
    }
  }catch(e){ console.error(e); }
  g.ids.forEach(id => readyVoices.delete(id));
  store.set('readyVoices', [...readyVoices]);
  store.set('dlPending', dlPending().filter(x => x.key !== g.key));
  // se era la voce in uso passo a una voce già pronta
  if(state.engine === 'piper' && g.ids.includes(state.piperVoice)){
    const alt = PIPER_VOICES.find(v => voiceReady(v.id));

    if(store.get('gemKey')) selectVoice('piper', GEM_VOICES[0].id);

  refreshVoiceUI();
}

/* ---------- backup: libri, posizioni, note e impostazioni in un solo file ---------- */
// formato: riga "SIMA-BACKUP 1", riga con la lunghezza dell'intestazione, intestazione JSON, poi i file dei libri in fila
const BK_MAGIC = 'SIMA-BACKUP 1\n';
const BK_SKIP = k => k === 'gemKey' || k === 'audioBytes' || k === 'readyVoices' || k === 'lastBackup' || /^gemDone:/.test(k);
async function makeBackup(){
  const bins = [], parts = []; let off = 0;
  const pack = async v => {
    if(v instanceof Blob){ bins.push({ off, len: v.size, type: v.type, blob: 1 }); parts.push(v); off += v.size; return { $bin: bins.length - 1 }; }
    if(v instanceof ArrayBuffer || ArrayBuffer.isView(v)){ const b = v instanceof ArrayBuffer ? v : v.buffer.slice(v.byteOffset, v.byteOffset + v.byteLength); bins.push({ off, len: b.byteLength }); parts.push(b); off += b.byteLength; return { $bin: bins.length - 1 }; }
    if(Array.isArray(v)) return Promise.all(v.map(pack));
    if(v && typeof v === 'object'){ const o = {}; for(const k of Object.keys(v)) o[k] = await pack(v[k]); return o; }
    return v;
  };
  const db = await lib.open();
  const raw = await new Promise((res, rej) => { const t = db.transaction('books', 'readonly'); const r = t.objectStore('books').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); });
  const books = []; for(const b of raw) books.push(await pack(b));
  const ls = {};
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i); if(!k || k.indexOf('lettore:') !== 0) continue;
    const kk = k.slice(8); if(!BK_SKIP(kk)) ls[kk] = localStorage.getItem(k);
  }
  const head = JSON.stringify({ v: 1, app: APP_VERSION, at: Date.now(), ls, books, bins });
  const hb = new TextEncoder().encode(head);
  return { blob: new Blob([BK_MAGIC, hb.byteLength + '\n', hb, ...parts], { type: 'application/octet-stream' }), n: books.length };
}
async function saveBackup(btn){
  if(btn){ btn.disabled = true; btn.textContent = 'Preparo...'; }
  try{
    const { blob, n } = await makeBackup();
    const d = new Date(), pad = x => String(x).padStart(2, '0');
    const f = new File([blob], `SiMa-backup-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.simabackup`, { type: 'application/octet-stream' });
    let ok = false;
    if(navigator.canShare && navigator.canShare({ files: [f] })){
      try{ await navigator.share({ files: [f], title: 'Backup SiMa' }); ok = true; }
      catch(e){ if(e && e.name === 'AbortError'){ return; } }
    }
    if(!ok){ const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 60000); }
    store.set('lastBackup', Date.now());
    setStatus(`Backup pronto: ${n} ${n === 1 ? 'libro' : 'libri'}, posizioni, note e impostazioni.`);
  }catch(e){ console.error(e); setStatus('Non sono riuscito a preparare il backup.', true); }
  finally{ if(view === 'set') openSettings(null, true); }
}
async function restoreBackup(file){
  try{
    const magic = await file.slice(0, BK_MAGIC.length).text();
    if(magic !== BK_MAGIC) return setStatus('Questo file non è un backup di SiMa.', true);
    const lenTxt = await file.slice(BK_MAGIC.length, BK_MAGIC.length + 24).text();
    const nl = lenTxt.indexOf('\n'), hlen = parseInt(lenTxt.slice(0, nl), 10);
    const hStart = BK_MAGIC.length + nl + 1, dStart = hStart + hlen;
    const head = JSON.parse(await file.slice(hStart, dStart).text());
    const nb = (head.books || []).length;
    if(!confirm(`Ripristinare il backup del ${new Date(head.at).toLocaleDateString('it-IT')}? Contiene ${nb} ${nb === 1 ? 'libro' : 'libri'} con posizioni e note. I libri già presenti restano, quelli uguali vengono sostituiti dalla copia del backup.`)) return;
    setStatus('Ripristino il backup...', false, true);
    const unpack = async v => {
      if(v && typeof v === 'object' && !Array.isArray(v) && typeof v.$bin === 'number' && Object.keys(v).length === 1){
        const b = head.bins[v.$bin], part = file.slice(dStart + b.off, dStart + b.off + b.len, b.type || '');
        return b.blob ? new Blob([await part.arrayBuffer()], { type: b.type || '' }) : await part.arrayBuffer();
      }
      if(Array.isArray(v)) return Promise.all(v.map(unpack));
      if(v && typeof v === 'object'){ const o = {}; for(const k of Object.keys(v)) o[k] = await unpack(v[k]); return o; }
      return v;
    };
    for(const b of head.books || []) await lib.put(await unpack(b));
    for(const [k, v] of Object.entries(head.ls || {})){ if(!BK_SKIP(k)) try{ localStorage.setItem('lettore:' + k, v); }catch(e){} }
    prefs = store.get('prefs') || {}; applyTheme();
    filter = store.get('filter') || 'all'; renderChips();
    setStatus(`Backup ripristinato: ${nb} ${nb === 1 ? 'libro' : 'libri'}.` + (store.get('gemKey') ? '' : ' Per le voci Google incolla di nuovo la chiave.'));
    const last = store.get('lastBook'); if(last && !state.key) await loadBook(last).catch(() => {});
    await renderLibrary();
    if(view === 'set') openSettings(null, true);
  }catch(e){ console.error(e); setStatus('Non riesco a leggere questo backup. Potrebbe essere incompleto.', true); }
}


/* ---------- statistiche di ascolto: tempo di riproduzione reale, sul telefono, senza costi ---------- */
// per giorno (ora locale): secondi per ora e per voce (v), secondi per libro e per voce (b). Solo numeri interi.
const STATS_KEEP_DAYS = 400;
let statsPending = [], statsLast = 0;
function localDay(d){ d = d || new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function statsVoiceId(){ return state.engine === 'sys' ? 'sys:' + (state.sysVoice ? state.sysVoice.voiceURI : 'iphone') : (state.piperVoice || 'nessuna'); }
function statsVoiceCat(vid){ return vid === 'legacy' ? 'none' : vid.startsWith('sys:') ? 'sys' : isGemId(vid) ? 'gem' : 'piper'; }
function statsAdd(key, title, secs){
  const day = localDay(), hr = new Date().getHours(), vid = statsVoiceId(), vname = voiceName() || 'Voce';
  const p = statsPending.find(x => x.day === day && x.key === key && x.vid === vid && x.h === hr);
  if(p) p.s += secs; else statsPending.push({ day, key, title, vid, vname, h: hr, s: secs });
}
function statsApply(st, p){
  const r = st[p.day] || { v: {}, b: {} };
  if(!r.v) r.v = {};
  if(!r.v[p.vid]) r.v[p.vid] = Array(24).fill(0);
  r.v[p.vid][p.h] = (r.v[p.vid][p.h] || 0) + p.s;
  if(!r.b) r.b = {};
  if(!r.b[p.key]) r.b[p.key] = {};
  r.b[p.key][p.vid] = (r.b[p.key][p.vid] || 0) + p.s;
  st[p.day] = r;
}
function statsFlush(){
  if(!statsPending.length) return;
  try{
    const st = statsNormalize(store.get('stats') || {}), titles = store.get('statsTitles') || {}, voices = store.get('statsVoices') || {};
    for(const p of statsPending){ statsApply(st, p); if(p.title) titles[p.key] = p.title; voices[p.vid] = p.vname; }
    statsPending = [];
    const cutoff = localDay(new Date(Date.now() - STATS_KEEP_DAYS * 864e5));
    for(const d of Object.keys(st)){
      if(d < cutoff){ delete st[d]; continue; }
      for(const vid of Object.keys(st[d].v || {})) st[d].v[vid] = st[d].v[vid].map(Math.round);
      for(const k of Object.keys(st[d].b || {})) for(const vid of Object.keys(st[d].b[k])) st[d].b[k][vid] = Math.round(st[d].b[k][vid]);
    }
    store.set('stats', st); store.set('statsTitles', titles); store.set('statsVoices', voices);
  }catch(e){}
}
// un tick ogni secondo: conta solo mentre la lettura è in corso; i buchi lunghi (schermo spento, app sospesa) non vengono contati
setInterval(() => {
  const now = Date.now(), gap = statsLast ? now - statsLast : 0; statsLast = now;
  if(state.playing && state.key && gap > 0 && gap < 5000){ statsAdd(state.key, state.meta && state.meta.title, gap / 1000); }
  if(statsPending.length && (now % 15000) < 1000) statsFlush();
}, 1000);
document.addEventListener('visibilitychange', () => { if(document.hidden) statsFlush(); });
addEventListener('pagehide', statsFlush);

let statsRange = store.get('statsRange') || 'oggi';
let statsVoice = store.get('statsVoice') || 'all';
// legge un giorno applicando il filtro voce: ore, libri
function statsPick(r, filter){
  const hours = Array(24).fill(0), books = {};
  const match = vid => filter === 'all' ? true
    : filter.startsWith('cat:') ? statsVoiceCat(vid) === filter.slice(4)
    : vid === filter.slice(2);
  for(const vid of Object.keys(r.v || {})) if(match(vid)) r.v[vid].forEach((x, h) => hours[h] += x);
  for(const k of Object.keys(r.b || {})){ for(const vid of Object.keys(r.b[k])) if(match(vid)) books[k] = (books[k] || 0) + r.b[k][vid]; }
  return { hours, books, total: hours.reduce((a, b) => a + b, 0) };
}
// i dati della versione 45 (senza voce) diventano "voce non registrata"
function statsNormalize(st){
  for(const d of Object.keys(st)){
    const r = st[d];
    if(r.h && !r.v){ r.v = { legacy: r.h }; delete r.h; }
    if(r.b){ for(const k of Object.keys(r.b)) if(typeof r.b[k] === 'number') r.b[k] = { legacy: r.b[k] }; }
  }
  return st;
}
function statsCollect(){
  const st = statsNormalize(JSON.parse(JSON.stringify(store.get('stats') || {})));
  for(const p of statsPending) statsApply(st, p);
  return st;
}
function renderStats(){
  const st = statsCollect(), titles = store.get('statsTitles') || {}, voices = store.get('statsVoices') || {};
  const now = new Date();
  // voci usate nei dati salvati, raggruppate per tipo
  const used = new Set();
  Object.values(st).forEach(r => Object.keys(r.v || {}).forEach(v => used.add(v)));
  const cats = [['gem', 'Voci Google'], ['piper', 'Voci sul telefono'], ['sys', 'Voci di sistema']].filter(([c]) => [...used].some(v => statsVoiceCat(v) === c));
  if(statsVoice !== 'all' && !(statsVoice.startsWith('cat:') ? cats.some(([c]) => 'cat:' + c === statsVoice) : used.has(statsVoice.slice(2)))) statsVoice = 'all';
  const ranges = [['oggi', 'Oggi'], ['7', '7 giorni'], ['30', '30 giorni'], ['tutto', 'Tutto']];
  const rb = $('sRange'); rb.textContent = '';
  ranges.forEach(([k, label]) => {
    const b = el('button', 'chip', label); b.setAttribute('aria-pressed', statsRange === k ? 'true' : 'false');
    b.onclick = () => { statsRange = k; store.set('statsRange', k); renderStats(); };
    rb.appendChild(b);
  });
  const sel = $('sVoice'); sel.textContent = '';
  const addOpt = (val, label, parent) => { const o = el('option', null, label); o.value = val; if(statsVoice === val) o.selected = true; (parent || sel).appendChild(o); };
  addOpt('all', 'Tutte le voci');
  cats.forEach(([c, label]) => {
    const g = el('optgroup'); g.label = label; addOpt('cat:' + c, 'Tutte ' + ({ gem: '(Google)', piper: '(telefono)', sys: '(iPhone)' })[c], g); sel.appendChild(g);
    [...used].filter(v => statsVoiceCat(v) === c).sort().forEach(v => addOpt('v:' + v, voices[v] || 'Voce', g));
  });
  if(used.has('legacy')) addOpt('v:legacy', 'Ascolti prima del filtro voci');
  const chart = $('sChart'); chart.textContent = '';
  const bars = [];
  let days = [];
  if(statsRange === 'oggi'){
    const r = st[localDay(now)] || {};
    const pk = statsPick(r, statsVoice);
    pk.hours.forEach((v, h) => bars.push({ label: h % 6 === 0 ? String(h) : '', v }));
    days = [pk];
  } else if(statsRange === 'tutto'){
    const months = {};
    for(const d of Object.keys(st)){
      const m = d.slice(0, 7), pk = statsPick(st[d], statsVoice);
      months[m] = months[m] || 0; months[m] += pk.total; days.push(pk);
    }
    Object.keys(months).sort().forEach(m => bars.push({ label: new Date(m + '-01').toLocaleDateString('it-IT', { month: 'short' }).replace('.', ''), v: months[m] }));
  } else {
    const n = +statsRange;
    for(let i = n - 1; i >= 0; i--){
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      const pk = statsPick(st[localDay(d)] || {}, statsVoice);
      days.push(pk);
      const label = n === 7 ? d.toLocaleDateString('it-IT', { weekday: 'short' }).replace('.', '') : (d.getDate() % 5 === 0 || i === 0 ? String(d.getDate()) : '');
      bars.push({ label, v: pk.total });
    }
  }
  const max = Math.max(1, ...bars.map(b => b.v));
  bars.forEach(b => {
    const col = el('div', 'sCol'); const bar = el('div', 'sBar'); bar.style.height = Math.max(b.v ? 3 : 0, Math.round(b.v / max * 100)) + '%';
    bar.title = fmtDur(b.v);
    col.appendChild(bar); col.appendChild(el('span', 'sLab', b.label)); chart.appendChild(col);
  });
  const total = bars.reduce((a, b) => a + b.v, 0);
  $('sBig').textContent = total ? fmtDur(total) : 'Nessun ascolto';
  const label = { oggi: 'oggi', '7': 'negli ultimi 7 giorni', '30': 'negli ultimi 30 giorni', tutto: 'in tutto' }[statsRange];
  let sub = label;
  if(statsRange === '7' || statsRange === '30'){ const active = days.filter(p => p.total > 0).length; if(active) sub += ` · in media ${fmtDur(total / active)} nei giorni in cui hai ascoltato`; }
  $('sSub').textContent = sub;
  const per = {};
  days.forEach(p => { for(const k of Object.keys(p.books)) per[k] = (per[k] || 0) + p.books[k]; });
  const list = $('sBooks'); list.textContent = '';
  const entries = Object.entries(per).sort((a, b) => b[1] - a[1]);
  if(!entries.length) list.appendChild(el('p', 'cardNote', 'Nessun ascolto in questo periodo.'));
  entries.slice(0, 8).forEach(([k, v]) => {
    const row = el('div', 'famRow');
    const t = el('div', 'famText'); t.appendChild(el('div', 'famTitle', titles[k] || 'Libro')); t.appendChild(el('div', 'famSub', fmtDur(v)));
    row.appendChild(t); list.appendChild(row);
  });
}
